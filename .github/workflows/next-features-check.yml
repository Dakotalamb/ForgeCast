name: Check next FDGCast features
on:
  push:
    branches: [next/audio-feedback-backup, next/tools-navigation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Python behavior
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -q
      - name: Verify browser interface without live platform actions
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
          node --check web/app.js
          node tests/browser-qa.cjs
          node tests/browser-productivity-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FDGCast-next-feature-UI
          path: qa-next/*.png
