name: Build FDGCast Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out FDGCast
        uses: actions/checkout@v4
      - name: Check out official OBS plugin build template
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-plugintemplate
          ref: master
          path: .obs-template
      - name: Configure OBS 32.2.2 native build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $template = Join-Path $env:GITHUB_WORKSPACE '.obs-template'
          Copy-Item 'native/forgecast.cpp' (Join-Path $template 'src/plugin-main.cpp') -Force
          Copy-Item 'packaging/ci-native-CMakeLists.txt' (Join-Path $template 'CMakeLists.txt') -Force
          $locale = Join-Path $template 'data/locale'
          New-Item -ItemType Directory -Force $locale | Out-Null
          Copy-Item 'packaging/en-US.ini' (Join-Path $locale 'en-US.ini') -Force
          Copy-Item 'packaging/FDGCast.ico' (Join-Path $template 'data/FDGCast.ico') -Force
          $specPath = Join-Path $template 'buildspec.json'
          $spec = Get-Content $specPath -Raw | ConvertFrom-Json
          $spec.name = 'forgecast'
          $spec.displayName = 'FDGCast'
          $spec.version = '0.5.3'
          $spec.author = 'Forged Destiny Gaming'
          $spec.website = 'https://forgeddestinygaming.com/'
          $spec.dependencies.'obs-studio'.version = '32.2.2'
          # The official template checks the OBS source archive's SHA-256.
          $archive = Join-Path $env:RUNNER_TEMP 'obs-studio-32.2.2.zip'
          Invoke-WebRequest 'https://github.com/obsproject/obs-studio/archive/refs/tags/32.2.2.zip' -OutFile $archive
          $spec.dependencies.'obs-studio'.hashes.'windows-x64' = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $spec | ConvertTo-Json -Depth 15 | Set-Content -Encoding UTF8 $specPath
      - name: Compile native OBS module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location '.obs-template'
          try {
            cmake --preset windows-ci-x64
            if ($LASTEXITCODE -ne 0) { throw 'Native configuration failed' }
            cmake --build --preset windows-ci-x64 --config Release --parallel
            if ($LASTEXITCODE -ne 0) { throw 'Native compilation failed' }
            cmake --install build_x64 --config Release --prefix "$env:GITHUB_WORKSPACE/stage"
            if ($LASTEXITCODE -ne 0) { throw 'Native staging failed' }
          } finally { Pop-Location }
          if (-not (Test-Path 'stage/forgecast/bin/64bit/forgecast.dll')) { throw 'OBS module DLL missing' }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source quality checks
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Test dependencies failed' }
          python -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Python tests failed' }
          python -m compileall -q forgecast launcher.py
          if ($LASTEXITCODE -ne 0) { throw 'Python compilation failed' }
          node --check web/app.js
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript syntax failed' }
      - name: Verify Companion UI in Chromium
        shell: pwsh
        run: |
          npm install --no-save playwright@1.56.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser QA dependency failed' }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser QA engine failed' }
          node tests/browser-qa.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser QA failed' }
      - name: Upload UI quality screenshots
        uses: actions/upload-artifact@v4
        with:
          name: FDGCast-0.5.3-UI-quality-check
          path: qa/*.png
          if-no-files-found: error
      - name: Freeze FDGCast companion
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install -r requirements.txt 'pyinstaller==6.16.0' 'pywebview==6.2.1'
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name FDGCast --icon "$env:GITHUB_WORKSPACE/packaging/FDGCast.ico" --paths $env:GITHUB_WORKSPACE --add-data "$env:GITHUB_WORKSPACE/web;web" --add-data "$env:GITHUB_WORKSPACE/packaging/FDGCast.ico;packaging" --distpath dist --workpath build-pyinstaller --specpath build-pyinstaller launcher.py
          if ($LASTEXITCODE -ne 0) { throw 'Companion freezing failed' }
          if (-not (Test-Path 'dist/FDGCast/FDGCast.exe')) { throw 'Companion EXE missing' }
          if (-not (Test-Path 'dist/FDGCast/_internal/packaging/FDGCast.ico')) { throw 'Window/taskbar icon missing from packaged app' }
      - name: Smoke test packaged local service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = (Resolve-Path 'dist/FDGCast/FDGCast.exe').Path
          $process = Start-Process $app -ArgumentList '--headless' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 35; $i++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest 'http://127.0.0.1:17654/' -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { if ($process.HasExited) { throw 'FDGCast packaged service exited on startup' } }
            }
            if (-not $ready) { throw 'FDGCast packaged service did not become ready' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Smoke test FDGCast desktop window
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = (Resolve-Path 'dist/FDGCast/FDGCast.exe').Path
          $process = Start-Process $app -PassThru
          try {
            $opened = $false
            for ($i = 0; $i -lt 25; $i++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw 'FDGCast desktop app exited before showing a window' }
              if ($process.MainWindowHandle -ne [IntPtr]::Zero) { $opened = $true; break }
            }
            if (-not $opened) { throw 'FDGCast desktop window did not open' }
            Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class FDGWindowIcon { [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr window, uint message, IntPtr which, IntPtr unused); }'
            $windowIcon = [IntPtr]::Zero
            for ($i = 0; $i -lt 15; $i++) {
              $windowIcon = [FDGWindowIcon]::SendMessage($process.MainWindowHandle, 0x7F, [IntPtr]1, [IntPtr]::Zero)
              if ($windowIcon -ne [IntPtr]::Zero) { break }
              Start-Sleep -Milliseconds 300
            }
            if ($windowIcon -eq [IntPtr]::Zero) { throw 'FDGCast window/taskbar icon was not applied' }
            $second = Start-Process $app -PassThru
            if (-not $second.WaitForExit(10000)) { Stop-Process -Id $second.Id -Force; throw 'Duplicate desktop app did not exit' }
            if ($second.ExitCode -ne 0) { throw 'Duplicate desktop app failed' }
            $bridge = Join-Path $env:LOCALAPPDATA 'ForgeCast/bridge-token'
            if (-not (Test-Path $bridge)) { throw 'FDGCast OBS bridge token missing' }
            $token = (Get-Content $bridge -Raw).Trim()
            $response = Invoke-RestMethod 'http://127.0.0.1:17654/native/action' -Method Post `
              -Headers @{Authorization="Bearer $token"} -ContentType 'application/json' `
              -Body '{"action":"focus"}'
            if (-not $response.ok) { throw 'OBS Open FDGCast app action failed' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Install Inno Setup and create installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe missing' }
          & $iscc 'packaging/FDGCast.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer creation failed' }
          if (-not (Test-Path 'release/FDGCast-0.5.3-preview-win-x64-setup.exe')) { throw 'Installer EXE missing' }
      - name: Smoke test installed OBS module location
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'release/FDGCast-0.5.3-preview-win-x64-setup.exe').Path
          $installed = Join-Path $env:ProgramData 'obs-studio/plugins/forgecast/bin/64bit/forgecast.dll'
          $process = Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          if (-not (Test-Path $installed)) { throw "OBS module missing after install: $installed" }
          $installedHash = (Get-FileHash $installed -Algorithm SHA256).Hash
          $builtHash = (Get-FileHash 'stage/forgecast/bin/64bit/forgecast.dll' -Algorithm SHA256).Hash
          if ($installedHash -ne $builtHash) { throw 'Installed OBS module differs from compiled module' }
          $companion = Get-ItemPropertyValue 'HKLM:\Software\Forged Destiny Gaming\FDGCast' 'CompanionPath'
          if (-not (Test-Path $companion)) { throw 'OBS Companion launch path was not registered' }
      - name: Upload installer for private testing
        uses: actions/upload-artifact@v4
        with:
          name: FDGCast-0.5.3-OBS-32.2.2-Windows-preview-installer
          path: release/FDGCast-0.5.3-preview-win-x64-setup.exe
          if-no-files-found: error
