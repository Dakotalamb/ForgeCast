name: Build FDGCast Windows installer

on:
  push:
    branches: [main, release/0.9.0, next/output-recovery, next/tiktok-live-events]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out FDGCast
        uses: actions/checkout@v4
      - name: Check out official OBS plugin build template
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-plugintemplate
          ref: master
          path: .obs-template
      - name: Check vertical framing geometry
        shell: pwsh
        run: |
          cmake -S tests/portrait -B build-portrait
          if ($LASTEXITCODE -ne 0) { throw 'Portrait test configuration failed' }
          cmake --build build-portrait --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Portrait test compilation failed' }
          ./build-portrait/Release/portrait-layout-test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Portrait framing tests failed' }
          ./build-portrait/Release/main-picture-test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Main stream routing tests failed' }
          ./build-portrait/Release/render-guard-test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Renderer recursion guard failed' }
      - name: Configure OBS 32.2.2 native build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $template = Join-Path $env:GITHUB_WORKSPACE '.obs-template'
          Copy-Item 'native/forgecast.cpp' (Join-Path $template 'src/plugin-main.cpp') -Force
          Copy-Item 'native/chat-scroll-follow.hpp' (Join-Path $template 'src/chat-scroll-follow.hpp') -Force
          Copy-Item 'native/portrait-layout.hpp' (Join-Path $template 'src/portrait-layout.hpp') -Force
          Copy-Item 'native/main-picture.hpp' (Join-Path $template 'src/main-picture.hpp') -Force
          Copy-Item 'native/vertical-canvas.hpp' (Join-Path $template 'src/vertical-canvas.hpp') -Force
          Copy-Item 'native/vertical-canvas-frontend.hpp' (Join-Path $template 'src/vertical-canvas-frontend.hpp') -Force
          Copy-Item 'native/rtmp-encoders.hpp' (Join-Path $template 'src/rtmp-encoders.hpp') -Force
          Copy-Item 'native/portrait-video.hpp' (Join-Path $template 'src/portrait-video.hpp') -Force
          Copy-Item 'native/render-guard.hpp' (Join-Path $template 'src/render-guard.hpp') -Force
          Copy-Item 'tests/canvas/frontend-qa.cpp' (Join-Path $template 'src/frontend-qa.cpp') -Force
          Copy-Item 'tests/encoded/video-qa.cpp' (Join-Path $template 'src/video-qa.cpp') -Force
          Copy-Item 'native/vertical-render.hpp' (Join-Path $template 'src/vertical-render.hpp') -Force
          Copy-Item 'packaging/ci-native-CMakeLists.txt' (Join-Path $template 'CMakeLists.txt') -Force
          $locale = Join-Path $template 'data/locale'
          New-Item -ItemType Directory -Force $locale | Out-Null
          Copy-Item 'packaging/en-US.ini' (Join-Path $locale 'en-US.ini') -Force
          Copy-Item 'packaging/FDGCast.ico' (Join-Path $template 'data/FDGCast.ico') -Force
          $specPath = Join-Path $template 'buildspec.json'
          $spec = Get-Content $specPath -Raw | ConvertFrom-Json
          $spec.name = 'forgecast'
          $spec.displayName = 'FDGCast'
          $spec.version = '1.0.3'
          $spec.author = 'Forged Destiny Gaming'
          $spec.website = 'https://forgeddestinygaming.com/'
          $spec.dependencies.'obs-studio'.version = '32.2.2'
          # The official template checks the OBS source archive's SHA-256.
          $archive = Join-Path $env:RUNNER_TEMP 'obs-studio-32.2.2.zip'
          Invoke-WebRequest 'https://github.com/obsproject/obs-studio/archive/refs/tags/32.2.2.zip' -OutFile $archive
          $spec.dependencies.'obs-studio'.hashes.'windows-x64' = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $spec | ConvertTo-Json -Depth 15 | Set-Content -Encoding UTF8 $specPath
      - name: Compile native OBS module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location '.obs-template'
          try {
            cmake --preset windows-ci-x64
            if ($LASTEXITCODE -ne 0) { throw 'Native configuration failed' }
            cmake --build --preset windows-ci-x64 --config Release --parallel
            if ($LASTEXITCODE -ne 0) { throw 'Native compilation failed' }
            cmake --install build_x64 --config Release --prefix "$env:GITHUB_WORKSPACE/stage"
            if ($LASTEXITCODE -ne 0) { throw 'Native staging failed' }
          } finally { Pop-Location }
          if (-not (Test-Path 'stage/forgecast/bin/64bit/forgecast.dll')) { throw 'OBS module DLL missing' }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source quality checks
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Test dependencies failed' }
          python -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Python tests failed' }
          python -m compileall -q forgecast launcher.py
          if ($LASTEXITCODE -ne 0) { throw 'Python compilation failed' }
          node --check web/app.js
          node --check web/studio-editor.js
          node --check web/studio-player.js
          node --check web/vertical-studio.js
          node tests/test-overlay-renderer.cjs
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript syntax failed' }
      - name: Verify real OBS encoded landscape and portrait outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:RUNNER_TEMP 'obs-runtime-32.2.2'
          $archive = Join-Path $env:RUNNER_TEMP 'obs-runtime-32.2.2.zip'
          Invoke-WebRequest 'https://github.com/obsproject/obs-studio/releases/download/32.2.2/OBS-Studio-32.2.2-Windows-x64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4d6e40e3ab155f56b30de517380566a206d74b63cdf5ad49aa596924768f97e1') { throw 'Official OBS runtime checksum mismatch' }
          Expand-Archive $archive $runtime -Force
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
          $env:Path = "$env:ChocolateyInstall/bin;" + $env:Path
          $harness = Get-ChildItem '.obs-template/build_x64' -Recurse -Filter 'fdgcast-video-qa.exe' | Select-Object -First 1
          if (-not $harness) { throw 'Native video harness missing' }
          $binary = Join-Path $runtime 'bin/64bit/fdgcast-video-qa.exe'
          Copy-Item $harness.FullName $binary -Force
          python tests/encoded/run.py --exe $binary --runtime $runtime --out qa-encoded
          if ($LASTEXITCODE -ne 0) { throw 'Real encoded output verification failed; do not publish this candidate' }
      - name: Upload encoded output evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FDGCast-1.0.3-rc.1-encoded-output-evidence
          path: qa-encoded/
          if-no-files-found: ignore
      - name: Verify Additional Canvas in the real OBS frontend
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'obs-runtime-32.2.2'
          $module = Get-ChildItem '.obs-template/build_x64' -Filter 'fdgcast-canvas-qa.dll' -Recurse | Select-Object -First 1
          if (-not $module) { throw 'Canvas frontend test module missing' }
          python tests/canvas/run.py --runtime $runtime --module $module.FullName --out qa-canvas
          if ($LASTEXITCODE -ne 0) { throw 'OBS frontend canvas validation failed' }
      - name: Upload canvas frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FDGCast-canvas-frontend-evidence
          path: qa-canvas/
          if-no-files-found: ignore
      - name: Verify Companion UI in Chromium
        shell: pwsh
        run: |
          npm install --no-save playwright@1.56.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser QA dependency failed' }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser QA engine failed' }
          node tests/browser-qa.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser QA failed' }
          node tests/browser-productivity-qa.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Productivity browser QA failed' }
          node tests/browser-overlay-studio-qa.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Productivity browser QA failed' }
          node tests/browser-vertical-qa.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Vertical Studio browser QA failed' }
      - name: Upload UI quality screenshots
        uses: actions/upload-artifact@v4
        with:
          name: FDGCast-1.0.3-rc.1-UI-quality-check
          path: |
            qa/*.png
            qa-next/*.png
          if-no-files-found: error
      - name: Freeze FDGCast companion
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install -r requirements.txt 'pyinstaller==6.16.0' 'pywebview==6.2.1'
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name FDGCast --icon "$env:GITHUB_WORKSPACE/packaging/FDGCast.ico" --paths $env:GITHUB_WORKSPACE --collect-all TikTokLive --collect-all TikTokLiveProto --collect-all EulerApiSdk --collect-all betterproto2 --collect-all grpc --collect-all tzdata --hidden-import google.protobuf.duration_pb2 --add-data "$env:GITHUB_WORKSPACE/web;web" --add-data "$env:GITHUB_WORKSPACE/packaging/FDGCast.ico;packaging" --distpath dist --workpath build-pyinstaller --specpath build-pyinstaller launcher.py
          if ($LASTEXITCODE -ne 0) { throw 'Companion freezing failed' }
          if (-not (Test-Path 'dist/FDGCast/FDGCast.exe')) { throw 'Companion EXE missing' }
          if (-not (Test-Path 'dist/FDGCast/_internal/packaging/FDGCast.ico')) { throw 'Window/taskbar icon missing from packaged app' }
      - name: Smoke test packaged local service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = (Resolve-Path 'dist/FDGCast/FDGCast.exe').Path
          $check = Start-Process $app -ArgumentList '--stream-self-check' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw 'Frozen YouTube transport dependency check failed' }
          $extras = Start-Process $app -ArgumentList '--extras-self-check' -Wait -PassThru
          if ($extras.ExitCode -ne 0) { throw 'Frozen TikTok dependency check failed' }
          $process = Start-Process $app -ArgumentList '--headless' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 35; $i++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest 'http://127.0.0.1:17654/' -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { if ($process.HasExited) { throw 'FDGCast packaged service exited on startup' } }
            }
            if (-not $ready) { throw 'FDGCast packaged service did not become ready' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Smoke test FDGCast desktop window
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = (Resolve-Path 'dist/FDGCast/FDGCast.exe').Path
          $process = Start-Process $app -PassThru
          try {
            $opened = $false
            for ($i = 0; $i -lt 25; $i++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw 'FDGCast desktop app exited before showing a window' }
              if ($process.MainWindowHandle -ne [IntPtr]::Zero) { $opened = $true; break }
            }
            if (-not $opened) { throw 'FDGCast desktop window did not open' }
            Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class FDGWindowIcon { [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr window, uint message, IntPtr which, IntPtr unused); }'
            $windowIcon = [IntPtr]::Zero
            for ($i = 0; $i -lt 15; $i++) {
              $windowIcon = [FDGWindowIcon]::SendMessage($process.MainWindowHandle, 0x7F, [IntPtr]1, [IntPtr]::Zero)
              if ($windowIcon -ne [IntPtr]::Zero) { break }
              Start-Sleep -Milliseconds 300
            }
            if ($windowIcon -eq [IntPtr]::Zero) { throw 'FDGCast window/taskbar icon was not applied' }
            $second = Start-Process $app -PassThru
            if (-not $second.WaitForExit(10000)) { Stop-Process -Id $second.Id -Force; throw 'Duplicate desktop app did not exit' }
            if ($second.ExitCode -ne 0) { throw 'Duplicate desktop app failed' }
            $bridge = Join-Path $env:LOCALAPPDATA 'ForgeCast/bridge-token'
            if (-not (Test-Path $bridge)) { throw 'FDGCast OBS bridge token missing' }
            $token = (Get-Content $bridge -Raw).Trim()
            $response = Invoke-RestMethod 'http://127.0.0.1:17654/native/action' -Method Post `
              -Headers @{Authorization="Bearer $token"} -ContentType 'application/json' `
              -Body '{"action":"focus"}'
            if (-not $response.ok) { throw 'OBS Open FDGCast app action failed' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Install Inno Setup and create installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe missing' }
          & $iscc 'packaging/FDGCast.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer creation failed' }
          if (-not (Test-Path 'release/FDGCast-1.0.3-rc.1-win-x64-setup.exe')) { throw 'Installer EXE missing' }
      - name: Smoke test installed OBS module location
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'release/FDGCast-1.0.3-rc.1-win-x64-setup.exe').Path
          $installed = Join-Path $env:ProgramData 'obs-studio/plugins/forgecast/bin/64bit/forgecast.dll'
          $process = Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          if (-not (Test-Path $installed)) { throw "OBS module missing after install: $installed" }
          $installedHash = (Get-FileHash $installed -Algorithm SHA256).Hash
          $builtHash = (Get-FileHash 'stage/forgecast/bin/64bit/forgecast.dll' -Algorithm SHA256).Hash
          if ($installedHash -ne $builtHash) { throw 'Installed OBS module differs from compiled module' }
          $companion = Get-ItemPropertyValue 'HKLM:\Software\Forged Destiny Gaming\FDGCast' 'CompanionPath'
          if (-not (Test-Path $companion)) { throw 'OBS Companion launch path was not registered' }
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FDGCast-1.0.3-rc.1-OBS-32.2.2-Windows-installer
          path: release/FDGCast-1.0.3-rc.1-win-x64-setup.exe
          if-no-files-found: error

      - name: Publish approved stable 1.0.2 release
        if: github.ref == 'refs/heads/release/0.9.0' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = python -c "from forgecast import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read package version' }
          if ($version -ne '1.0.2') { throw 'Package version does not match the approved stable release' }
          $tag = 'v1.0.2'
          $installer = 'release/FDGCast-1.0.2-win-x64-setup.exe'
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FDGCast-1.0.2-win-x64-setup.exe" | Set-Content 'release/SHA256SUMS.txt' -Encoding utf8NoBOM
          $manifest = Get-Content 'docs/latest-release.example.json' -Raw | ConvertFrom-Json
          $manifest | Add-Member -NotePropertyName sha256 -NotePropertyValue $hash -Force
          $manifest | ConvertTo-Json -Depth 6 | Set-Content 'release/latest.json' -Encoding utf8NoBOM
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; refusing to replace published binaries' }
          gh release create $tag --target '${{ github.sha }}' --title 'FDGCast 1.0.2' --notes-file 'docs/RELEASE_1.0.2.md' --draft
          if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
          gh release upload $tag $installer 'release/SHA256SUMS.txt' 'release/latest.json'
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed; release remains draft' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

